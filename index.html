<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaxChat Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .screen { display: none; }
        .active { display: block; }
        input, button { display: block; width: 100%; padding: 10px; margin-bottom: 10px; font-size: 16px; }
    </style>
</head>
<body>
    <div id="screen-login" class="screen active">
        <h2>Вход</h2>
        <input type="text" id="inp-name" placeholder="Имя">
        <input type="text" id="inp-phone" placeholder="Номер">
        <input type="password" id="inp-pass" placeholder="Пароль">
        <button onclick="alert('Кнопка РАБОТАЕТ!')">Проверить кнопку</button>
        <button onclick="doRegister()">Зарегистрироваться</button>
    </div>
    <script>
        function doRegister() {
            alert("Нажата кнопка регистрации! Имя: " + document.getElementById('inp-name').value);
        }
    </script>
</body>
</html>
