<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MaxChat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f0f2f5; height: 100vh; display: flex; justify-content: center; }
        #app { width: 100%; max-width: 600px; background: #fff; display: flex; flex-direction: column; height: 100%; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        
        /* Экран входа */
        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 20px; }
        #login-screen h1 { color: #007bff; margin-bottom: 20px; }
        #login-screen input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        #login-screen button { width: 100%; padding: 15px; background: #007bff; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }

        /* Экран чата */
        #chat-screen { display: none; flex-direction: column; height: 100%; }
        #header { background: #007bff; color: #fff; padding: 15px; display: flex; align-items: center; font-size: 18px; font-weight: bold; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #e5ddd5; }
        .message { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .message.my { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; }
        .message.other { align-self: flex-start; background: #fff; border-bottom-left-radius: 2px; }
        .message .sender { font-size: 12px; color: #007bff; margin-bottom: 3px; font-weight: bold; }
        
        #input-area { display: flex; padding: 10px; background: #f0f0f0; }
        #input-area input { flex: 1; padding: 12px; border: none; border-radius: 20px; font-size: 16px; outline: none; }
        #input-area button { background: #007bff; color: #fff; border: none; border-radius: 50%; width: 45px; height: 45px; margin-left: 10px; cursor: pointer; font-size: 18px; display: flex; justify-content: center; align-items: center; }
    </style>
    <!-- Подключаем Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div id="app">
        <!-- Экран входа -->
        <div id="login-screen">
            <h1>MaxChat</h1>
            <input type="text" id="username" placeholder="Введите ваше имя" maxlength="20">
            <button onclick="login()">Войти в чат</button>
        </div>

        <!-- Экран чата -->
        <div id="chat-screen">
            <div id="header">
                <span>Общий чат</span>
            </div>
            <div id="messages"></div>
            <div id="input-area">
                <input type="text" id="message-input" placeholder="Сообщение..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        // Твои конфигурационные данные Firebase (из google-services.json)
        const firebaseConfig = {
            apiKey: "AIzaSyBjRTWj1Po-L0g1CRfGmofuqarnHV66Ewo",
            authDomain: "maxchat-5e82f.firebaseapp.com",
            databaseURL: "https://maxchat-5e82f-default-rtdb.firebaseio.com",
            projectId: "maxchat-5e82f",
            storageBucket: "maxchat-5e82f.firebasestorage.app",
            messagingSenderId: "321397267482",
            appId: "1:321397267482:android:98e6e543adaa02d99a45a3"
        };

        // Инициализация Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database().ref("chats/general"); // Слушаем только "Общий чат"

        let username = "";
        let lastMessageTime = 0;

        function login() {
            const nameInput = document.getElementById("username").value.trim();
            if (nameInput.length > 0) {
                username = nameInput;
                localStorage.setItem("maxchat_name", username); // Сохраняем имя в браузере
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("chat-screen").style.display = "flex";
                listenForMessages();
            }
        }

        // Если имя уже сохранено, пропускаем вход
        window.onload = function() {
            const savedName = localStorage.getItem("maxchat_name");
            if (savedName) {
                username = savedName;
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("chat-screen").style.display = "flex";
                listenForMessages();
            }
        };

        function listenForMessages() {
            database.on('value', (snapshot) => {
                const messagesContainer = document.getElementById("messages");
                messagesContainer.innerHTML = ""; // Очищаем экран

                snapshot.forEach((childSnapshot) => {
                    const msg = childSnapshot.val();
                    const sender = msg.user || "Аноним";
                    const text = msg.text || "";
                    const timestamp = msg.timestamp || 0;

                    const isMine = (sender === username);
                    
                    const msgDiv = document.createElement("div");
                    msgDiv.className = "message " + (isMine ? "my" : "other");
                    
                    if (!isMine) {
                        const senderDiv = document.createElement("div");
                        senderDiv.className = "sender";
                        senderDiv.textContent = sender;
                        msgDiv.appendChild(senderDiv);
                    }

                    const textDiv = document.createElement("div");
                    textDiv.textContent = text;
                    msgDiv.appendChild(textDiv);

                    messagesContainer.appendChild(msgDiv);

                    if (timestamp > lastMessageTime) {
                        lastMessageTime = timestamp;
                    }
                });
                
                // Прокручиваем вниз
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        function sendMessage() {
            const input = document.getElementById("message-input");
            const text = input.value.trim();
            
            if (text.length > 0) {
                const messageData = {
                    user: username,
                    text: text,
                    timestamp: Date.now()
                };
                // Отправляем в Firebase (сообщение появится через слушатель)
                database.push(messageData);
                input.value = "";
            }
        }

        function handleKeyPress(e) {
            if (e.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
