<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MaxChat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f0f2f5; height: 100vh; display: flex; justify-content: center; }
        #app { width: 100%; max-width: 600px; background: #fff; display: flex; flex-direction: column; height: 100%; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        
        /* Экран входа */
        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 20px; }
        #login-screen h1 { color: #007bff; margin-bottom: 20px; }
        #login-screen input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        #login-screen button { width: 100%; padding: 15px; background: #007bff; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }

        /* Экран чата */
        #chat-screen { display: none; flex-direction: column; height: 100%; }
        #header { background: #007bff; color: #fff; padding: 15px; display: flex; align-items: center; font-size: 18px; font-weight: bold; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #e5ddd5; }
        .message { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .message.my { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; }
        .message.other { align-self: flex-start; background: #fff; border-bottom-left-radius: 2px; }
        .message .sender { font-size: 12px; color: #666; margin-bottom: 3px; font-weight: bold; }
        
        #input-area { display: flex; padding: 10px; background: #f0f0f0; }
        #input-area input { flex: 1; padding: 12px; border: none; border-radius: 20px; font-size: 16px; outline: none; }
        #input-area button { background: #007bff; color: #fff; border: none; border-radius: 50%; width: 45px; height: 45px; margin-left: 10px; cursor: pointer; font-size: 18px; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Экран входа -->
        <div id="login-screen">
            <h1>MaxChat</h1>
            <input type="text" id="username" placeholder="Введите ваше имя" maxlength="20">
            <button onclick="login()">Войти в чат</button>
        </div>

        <!-- Экран чата -->
        <div id="chat-screen">
            <div id="header">
                <span>Общий чат</span>
            </div>
            <div id="messages"></div>
            <div id="input-area">
                <input type="text" id="message-input" placeholder="Сообщение..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        let ws;
        let username = "";
        const chatRoom = "general"; // Пока один общий чат

        function login() {
            const nameInput = document.getElementById("username").value.trim();
            if (nameInput.length > 0) {
                username = nameInput;
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("chat-screen").style.display = "flex";
                connectWebSocket();
            }
        }

        function connectWebSocket() {
            // Подключаемся к нашему серверу на RelaxDev
            ws = new WebSocket("wss://maxchat.relaxdev.ru/");

            ws.onopen = function() {
                console.log("Подключено к серверу");
                // Сообщаем серверу, в какую комнату мы зашли
                ws.send(JSON.stringify({ room: chatRoom }));
            };

            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.text) {
                        addMessageToUI(data.user || "Аноним", data.text, false);
                    }
                } catch (e) {
                    console.error("Ошибка парсинга:", e);
                }
            };

            ws.onclose = function() {
                console.log("Соединение закрыто. Переподключение...");
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = function(err) {
                console.error("Ошибка WebSocket:", err);
            };
        }

        function sendMessage() {
            const input = document.getElementById("message-input");
            const text = input.value.trim();
            
            if (text.length > 0 && ws.readyState === WebSocket.OPEN) {
                const msg = {
                    room: chatRoom,
                    user: username,
                    text: text
                };
                ws.send(JSON.stringify(msg));
                
                // Сразу показываем свое сообщение
                addMessageToUI(username, text, true);
                input.value = "";
            }
        }

        function handleKeyPress(e) {
            if (e.key === "Enter") {
                sendMessage();
            }
        }

        function addMessageToUI(sender, text, isMine) {
            const messagesContainer = document.getElementById("messages");
            const msgDiv = document.createElement("div");
            msgDiv.className = "message " + (isMine ? "my" : "other");
            
            if (!isMine) {
                const senderDiv = document.createElement("div");
                senderDiv.className = "sender";
                senderDiv.textContent = sender;
                msgDiv.appendChild(senderDiv);
            }

            const textDiv = document.createElement("div");
            textDiv.textContent = text;
            msgDiv.appendChild(textDiv);

            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    </script>
</body>
</html>
